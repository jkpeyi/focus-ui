name: Publish to npm

# Uses npm Trusted Publishing (OIDC): no npm token is stored anywhere.
# One-time setup on npmjs.com → package → Settings → Trusted Publisher:
#   GitHub Actions · Organization/user: jkpeyi · Repository: focus-ui · Workflow: publish.yml
#
# Runs when a GitHub Release is published (tag must match package.json, e.g. v0.1.1),
# or manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for trusted publishing (and automatic provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships with npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json ($PKG)"; exit 1
          fi
      # prepublishOnly runs typecheck, tests and the build.
      - run: npm publish
